# D1 · Cỡ mẫu trên mỗi nhánh, alpha 0,05 hai phía, power 0,80, ICC 0,02.
# a) Từ 70% lên 75% cần 1.251 yêu cầu mỗi nhánh khi phân bổ từng yêu cầu.
# b) 75 yêu cầu/nhân viên cho DE 2,48, cần 3.103 yêu cầu và 42 người mỗi nhánh (84 > 40).
# c) 20 nhân viên mỗi nhánh cho trần mẫu hiệu dụng 20 / 0,02 = 1.000, dưới 1.251.
# d) 6 depot mỗi nhánh cho trần 300 và chỉ có 6 cụm.
# e) Với mục tiêu +6 điểm và 859 mẫu hiệu dụng, 20 người mỗi nhánh cần ≥299 yêu cầu/người, DE 6,96.
#
# D2 · Thiết kế theo yêu cầu
# 1. Hai nhánh cùng thời gian tại cùng depot.
# 2. Hệ thống phân bổ ngẫu nhiên 1:1 trước xử lý, theo khối trong từng depot và loại yêu cầu.
# 3. Nhân viên có thể học từ nhánh trợ lý. Khóa gợi ý theo request_id và kiểm log truy cập chéo.
# 4. Chốt chỉ số, cỡ mẫu, ngưỡng và ngày quyết định trước lần phân bổ đầu tiên.
# 5. Điều kiện 20 cụm/nhánh áp dụng cho thiết kế theo cụm. Ở đây đơn vị ngẫu nhiên là yêu cầu.
# Đánh đổi: đủ mẫu cho +5 điểm, nhưng hiệu ứng học hỏi có thể thu hẹp chênh lệch giữa hai nhánh.
# Mở lại 7 ngày: 51/1.200 = 4,25% toàn mẫu và 39/982 = 3,97% trong phạm vi.

